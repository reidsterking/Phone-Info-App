# Generate the Xcode project with: brew install xcodegen && xcodegen generate
name: DeviceTracker
options:
  deploymentTarget:
    iOS: "17.0"
targets:
  DeviceTracker:
    type: application
    platform: iOS
    sources:
      - path: DeviceTracker
    settings:
      base:
        # Change this to something unique to you, and use the same value for APNS_BUNDLE_ID on the server.
        PRODUCT_BUNDLE_IDENTIFIER: com.example.devicetracker
        # Your Apple Developer Team ID (Xcode > Settings > Accounts), or pick it in Signing & Capabilities.
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_FILE: DeviceTracker/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: DeviceTracker/DeviceTracker.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
